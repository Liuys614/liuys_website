<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louis Liu — Apps & Projects Showcase</title>
  <meta name="description" content="Personal showcase of iOS and web apps built by Louis Liu." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout-stage">
    <!-- Left Content Column -->
    <main class="content-col">
      <div class="top-section">
        <!-- Eyebrow Category -->
        <div class="eyebrow" id="eyebrowTag">• HEALTH & MEDICAL</div>

        <!-- Big Display Heading -->
        <h1 class="main-heading" id="mainHeading">Everything Your Health Regimen Needs</h1>

        <!-- Concise 1-Sentence Description -->
        <p class="concise-desc" id="conciseDesc">Stay on top of your daily health regimen with reliable schedule notifications, dosage tracking, and automated refill alerts.</p>

        <!-- Interactive App Accordion / Selector List -->
        <nav class="app-selector-list" id="appSelectorList" aria-label="Apps list">
          <!-- Rendered dynamically by app.js -->
        </nav>
      </div>

      <!-- Bottom Feature Step Cards Section -->
      <section class="features-section">
        <div class="section-label">• HOW IT WORKS</div>
        <div class="step-cards-grid" id="stepCardsGrid">
          <!-- Rendered dynamically by app.js -->
        </div>
      </section>
    </main>

    <!-- Right Sky Stage with Real Screenshots & Real App Icon -->
    <aside class="sky-stage" id="skyStage">
      <div class="cloud-backdrop"></div>

      <!-- Top Right Logo Badge -->
      <div class="brand-logo" title="Louis Liu">
        <div class="logo-symbol">LL</div>
      </div>

      <!-- Realistic Floating iPhone Frame -->
      <div class="device-wrapper">
        <div class="iphone-bezel">
          <div class="dynamic-notch"></div>
          <img src="images/pill.png" alt="App Screenshot" class="screen-img" id="screenImg" />
        </div>

        <!-- Overlaid Real App Icon -->
        <div class="app-icon-badge">
          <img src="images/icons/pill.png" alt="App Icon" id="appIconImg" />
        </div>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
